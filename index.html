<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Music Visualizer NCS Style</title>

<style>
body {
    margin: 0;
    background: radial-gradient(circle, #111, #000);
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
    text-align: center;
}

canvas {
    position: absolute;
    top: 0;
    left: 0;
}

.center-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-size: 22px;
    font-weight: bold;
    text-shadow: 0 0 15px cyan;
}

.controls {
    position: absolute;
    bottom: 30px;
    width: 100%;
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>
<div class="center-text" id="songName">CARGA UNA CANCIÓN</div>

<div class="controls">
    <input type="file" id="audioFile" accept="audio/*">
</div>

<script>
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;

let audioContext;
let analyser;
let dataArray;
let bufferLength;

document.getElementById("audioFile").addEventListener("change", function() {
    const file = this.files[0];
    if (!file) return;

    document.getElementById("songName").textContent = file.name;

    const audio = new Audio();
    audio.src = URL.createObjectURL(file);
    audio.autoplay = true;

    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    const source = audioContext.createMediaElementSource(audio);

    source.connect(analyser);
    analyser.connect(audioContext.destination);

    analyser.fftSize = 512;
    bufferLength = analyser.frequencyBinCount;
    dataArray = new Uint8Array(bufferLength);

    animate();
});

function animate() {
    requestAnimationFrame(animate);

    analyser.getByteFrequencyData(dataArray);

    ctx.clearRect(0, 0, canvas.width, canvas.height);

    let centerX = canvas.width / 2;
    let centerY = canvas.height / 2;
    let radius = 150;

    for (let i = 0; i < bufferLength; i++) {

        let angle = (i / bufferLength) * Math.PI * 2;
        let barHeight = dataArray[i] * 0.8;

        let x1 = centerX + Math.cos(angle) * radius;
        let y1 = centerY + Math.sin(angle) * radius;

        let x2 = centerX + Math.cos(angle) * (radius + barHeight);
        let y2 = centerY + Math.sin(angle) * (radius + barHeight);

        ctx.strokeStyle = `hsl(${i * 2}, 100%, 50%)`;
        ctx.lineWidth = 3;
        ctx.shadowBlur = 20;
        ctx.shadowColor = "cyan";

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.stroke();
    }
}
</script>

</body>
</html>
